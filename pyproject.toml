[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trpc-agent-service"
version = "0.1.0"
description = "Multi-tenant tRPC-Agent service platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "starlette==1.6.0",
    "trpc-agent-py==1.1.19",
    "uvicorn==0.52.4",
]

[project.scripts]
trpc-agent-sdk-validate = "trpc_service.agent.sdk_validation:main"
trpc-agent-local-serve = "trpc_service._cli:serve_main"
trpc-agent-local-send = "trpc_service._cli:send_main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
]

[tool.setuptools.packages.find]
include = ["trpc_service*"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
